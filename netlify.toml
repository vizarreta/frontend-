[build]
  command = "npm run build"
  publish = "dist"

# Proxy: Redirige /api/* al backend en Vercel
# Esto evita el bloqueo de CORS sin importar el nombre del sitio
[[redirects]]
  from = "/api/*"
  to = "https://sisacad-enrollments-backend.vercel.app/restful/:splat"
  status = 200
  force = true

# SPA: Redirige todas las rutas al index.html de Vue Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
